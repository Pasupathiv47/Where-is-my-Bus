<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bus Dashboard</title>
<style>
  body{font-family:sans-serif;margin:0;padding:16px;background:#f4f4f4}
  h2,h3{margin:8px 0}
  input,select,textarea,button{font-size:16px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
  textarea{height:90px;font-family:sans-serif}
  button{background:#1a73e8;color:#fff;border:0;border-radius:6px;width:auto;padding:8px 14px}
  .card{background:#fff;border-radius:8px;padding:12px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
  .sl{display:block;margin-top:8px;font-weight:bold;font-size:14px}
  small{color:#555}
  .via-row{display:flex;align-items:center;justify-content:space-between;background:#f0f4fb;border-radius:6px;padding:6px 10px;margin:4px 0}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .addrow button{width:auto;white-space:nowrap}
  .mini{background:#c62828;padding:4px 10px;font-size:13px}
  .upd{background:#555;padding:4px 8px;font-size:13px;margin-left:4px}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>Bus Dashboard Login</h2>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password">
  <button id="go">Login</button>
</div>

<div id="app" hidden>
  <div class="row"><h2>Bus Dashboard</h2><button id="out">Logout</button></div>

  <div class="card">
    <h3>Places (Bus Stops)</h3>
    <div class="addrow">
      <input id="pn" list="stopsDL" placeholder="Search or type a new place name">
      <button id="saveP">Add</button>
    </div>
    <div id="pl"></div>
  </div>

  <datalist id="stopsDL"></datalist>

  <div class="card">
    <h3>Buses (profile)</h3>
    <input id="bb" placeholder="Bus name or number (e.g. TN31 27A)">
    <input id="br" placeholder="Registration number (e.g. TN31AB1234)">
    <select id="bt"><option>TNSTC</option><option>Private</option></select>
    <input id="bp" type="file" accept="image/*">
    <img id="bprev" style="max-width:160px;display:none;border-radius:8px;margin-top:8px">
    <button id="saveB">Add bus</button>
    <div id="bl"></div>
  </div>

  <div class="card">
    <h3>Routes</h3>
    <label class="sl">Pick a bus profile (optional, fills the fields below)</label>
    <select id="pb"><option value="">-- Choose a bus profile --</option></select>
    <input id="bn" placeholder="Bus number (e.g. 27A)">

    <label class="sl">From (start place)</label>
    <input id="fr" list="stopsDL" placeholder="Search a place">

    <label class="sl">Stops in between, in order</label>
    <div class="addrow">
      <input id="viIn" list="stopsDL" placeholder="Search a place">
      <button id="viAdd">Add stop</button>
    </div>
    <div id="viList"></div>

    <label class="sl">To (final place)</label>
    <input id="rt" list="stopsDL" placeholder="Search a place">

    <select id="ty"><option>TNSTC</option><option>Private</option></select>
    <button id="saveR">Add route</button>
    <div id="rl"></div>
  </div>

  <div class="card">
    <h3>Trips and times</h3>
    <select id="tr"></select>
    <select id="dr"></select>
    <div id="ts"></div>
    <select id="td"><option>Daily</option><option>Mon-Sat</option><option>Sunday</option></select>
    <button id="addT">Add trip</button>
    <div id="tl"></div>
  </div>

  <div class="card">
    <h3>Auto round trips</h3>
    <small>Copies a trip, flips the direction each time, and repeats through the day.</small>
    <label class="sl">Copy from this trip</label>
    <select id="gs"></select>
    <label class="sl">How many more trips</label>
    <input id="gn" type="number" value="6">
    <label class="sl">Rest at each end (minutes)</label>
    <input id="gr" type="number" value="15">
    <button id="gen">Generate</button>
    <button id="delAll" style="background:#c62828">Delete all trips of this route</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrwRy4WCPb8GKFVjZHn36P1uZpcPj4Se0",
  authDomain: "bus-tracker-7c4d8.firebaseapp.com",
  projectId: "bus-tracker-7c4d8",
  storageBucket: "bus-tracker-7c4d8.firebasestorage.app",
  messagingSenderId: "245492004212",
  appId: "1:245492004212:web:7ea379f915eac8f8372821"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.addEventListener('unhandledrejection', e => alert(e.reason && e.reason.message ? e.reason.message : e.reason));

const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const toStr = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

let routes = [], timings = [], buses = [], places = [], viStops = [];
let editId = null, editBusId = null, started = false, stopKey = '', photoData = '';
const stopsOf = r => !r ? [] : (r.stops && r.stops.length ? r.stops : [r.from, r.to]);
const curRoute = () => routes.find(x => x.id === $('tr').value);
const dirNames = () => {
  const names = stopsOf(curRoute());
  return $('dr').value === 'r' ? names.slice().reverse() : names;
};

onAuthStateChanged(auth, u => {
  $('login').hidden = !!u;
  $('app').hidden = !u;
  if (u) start();
});
$('go').onclick = () => signInWithEmailAndPassword(auth, $('em').value, $('pw').value).catch(e => alert(e.message));
$('out').onclick = () => signOut(auth);

function start() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, 'places'), s => {
    places = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.deleted);
    drawPlaces();
  });
  onSnapshot(collection(db, 'routes'), s => {
    routes = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => !r.deleted);
    drawRoutes();
  });
  onSnapshot(collection(db, 'timings'), s => {
    timings = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => !t.deleted);
    drawTimes();
  });
  onSnapshot(collection(db, 'buses'), s => {
    buses = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => !b.deleted);
    drawBuses();
    drawPicker();
  });
}

function drawPlaces() {
  places.sort((a, b) => a.name.localeCompare(b.name));
  $('stopsDL').innerHTML = places.map(p => `<option value="${esc(p.name)}">`).join('');
  $('pl').innerHTML = places.map(p =>
    `<div class="row"><span>${esc(p.name)}</span><button class="mini" data-d="${p.id}">Del</button></div>`
  ).join('') || 'No places yet';
}

$('saveP').onclick = async () => {
  const name = $('pn').value.trim();
  if (!name) return alert('Enter a place name');
  if (places.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    $('pn').value = '';
    return alert('That place already exists');
  }
  await setDoc(doc(collection(db, 'places')), { name, deleted: false, updatedAt: Date.now() });
  $('pn').value = '';
};

$('pl').onclick = async e => {
  const id = e.target.dataset.d;
  if (id && confirm('Delete this place?')) {
    await setDoc(doc(db, 'places', id), { deleted: true, updatedAt: Date.now() }, { merge: true });
  }
};

function drawViList() {
  $('viList').innerHTML = viStops.map((n, i) =>
    `<div class="via-row"><span>${i + 1}. ${esc(n)}</span>
     <span><button class="upd" data-up="${i}">↑</button><button class="upd" data-dn="${i}">↓</button><button class="mini" data-rm="${i}">✕</button></span></div>`
  ).join('') || '<small>No in-between stops added</small>';
}

$('viAdd').onclick = () => {
  const v = $('viIn').value.trim();
  if (!v) return;
  viStops.push(v);
  $('viIn').value = '';
  drawViList();
};

$('viList').onclick = e => {
  const b = e.target;
  if (b.dataset.rm !== undefined) viStops.splice(+b.dataset.rm, 1);
  if (b.dataset.up !== undefined) {
    const i = +b.dataset.up;
    if (i > 0) [viStops[i - 1], viStops[i]] = [viStops[i], viStops[i - 1]];
  }
  if (b.dataset.dn !== undefined) {
    const i = +b.dataset.dn;
    if (i < viStops.length - 1) [viStops[i + 1], viStops[i]] = [viStops[i], viStops[i + 1]];
  }
  drawViList();
};

function drawPicker() {
  buses.sort((a, b) => a.busNo.localeCompare(b.busNo));
  const cur = $('pb').value;
  $('pb').innerHTML = '<option value="">-- Choose a bus profile --</option>' +
    buses.map(b => `<option value="${b.id}">${esc(b.busNo)} (${esc(b.regNo)}) - ${esc(b.type || 'TNSTC')}</option>`).join('');
  if (cur) $('pb').value = cur;
}

$('pb').onchange = () => {
  const b = buses.find(x => x.id === $('pb').value);
  if (!b) return;
  $('bn').value = b.busNo;
  $('ty').value = b.type || 'TNSTC';
};

function drawRoutes() {
  routes.sort((a, b) => a.busNo.localeCompare(b.busNo));
  $('rl').innerHTML = routes.map(r => {
    const mid = stopsOf(r).slice(1, -1);
    const via = mid.length ? `<br><small>via ${esc(mid.join(', '))}</small>` : '';
    return `<div class="row"><span><b>${esc(r.busNo)}</b> ${esc(r.from)} → ${esc(r.to)} (${esc(r.type)})${via}</span>
     <span><button data-e="${r.id}">Edit</button> <button class="mini" data-d="${r.id}">Del</button></span></div>`;
  }).join('') || 'No routes yet';
  const cur = $('tr').value;
  $('tr').innerHTML = routes.map(r =>
    `<option value="${r.id}">${esc(r.busNo)} ${esc(r.from)} → ${esc(r.to)}</option>`
  ).join('');
  if (cur) $('tr').value = cur;
  drawDirs();
  drawStopInputs();
  drawTimes();
}

function drawDirs() {
  const r = curRoute();
  const cur = $('dr').value || 'f';
  $('dr').innerHTML = r
    ? `<option value="f">${esc(r.from)} → ${esc(r.to)}</option><option value="r">${esc(r.to)} → ${esc(r.from)} (return)</option>`
    : '';
  if (r) $('dr').value = cur;
}

function drawStopInputs() {
  const r = curRoute();
  const names = dirNames();
  const key = (r ? r.id : '') + '|' + $('dr').value + '|' + names.join('|');
  if (key === stopKey) return;
  stopKey = key;
  $('ts').innerHTML = names.map((n, i) => {
    const tag = i === 0 ? ' (start)' : (i === names.length - 1 ? ' (arrival)' : '');
    return `<label class="sl">${esc(n)}${tag}</label><input type="time">`;
  }).join('');
}

$('saveR').onclick = async () => {
  const busNo = $('bn').value.trim(), from = $('fr').value.trim(), to = $('rt').value.trim(), type = $('ty').value;
  if (!busNo || !from || !to) return alert('Fill bus number, from and to');
  const stops = [from, ...viStops, to];
  const ref = editId ? doc(db, 'routes', editId) : doc(collection(db, 'routes'));
  await setDoc(ref, { busNo, from, to, type, stops, deleted: false, updatedAt: Date.now() }, { merge: true });
  editId = null;
  $('bn').value = ''; $('fr').value = ''; $('rt').value = ''; $('pb').value = '';
  viStops = []; drawViList();
  $('saveR').textContent = 'Add route';
};

$('rl').onclick = async e => {
  const b = e.target;
  if (b.dataset.e) {
    const r = routes.find(x => x.id === b.dataset.e);
    editId = r.id;
    $('bn').value = r.busNo; $('fr').value = r.from; $('rt').value = r.to; $('ty').value = r.type;
    viStops = stopsOf(r).slice(1, -1);
    drawViList();
    $('saveR').textContent = 'Update route';
    window.scrollTo(0, 0);
  }
  if (b.dataset.d && confirm('Delete this route?')) {
    await setDoc(doc(db, 'routes', b.dataset.d), { deleted: true, updatedAt: Date.now() }, { merge: true });
  }
};

function resizePhoto(file, cb) {
  const img = new Image();
  const reader = new FileReader();
  reader.onload = () => {
    img.onload = () => {
      const w = Math.min(300, img.width);
      const h = Math.round(img.height * (w / img.width));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', 0.6));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

$('bp').onchange = () => {
  const f = $('bp').files[0];
  if (!f) return;
  resizePhoto(f, url => { photoData = url; $('bprev').src = url; $('bprev').style.display = 'block'; });
};

function drawBuses() {
  buses.sort((a, b) => a.busNo.localeCompare(b.busNo));
  $('bl').innerHTML = buses.map(b =>
    `<div class="row">${b.photo ? `<img src="${b.photo}" style="width:56px;height:56px;object-fit:cover;border-radius:8px">` : ''}
     <span style="flex:1">&nbsp;<b>${esc(b.busNo)}</b><br><small>${esc(b.regNo)} · ${esc(b.type || 'TNSTC')}</small></span>
     <span><button data-e="${b.id}">Edit</button> <button class="mini" data-d="${b.id}">Del</button></span></div>`
  ).join('') || 'No buses yet';
}

$('saveB').onclick = async () => {
  const busNo = $('bb').value.trim(), regNo = $('br').value.trim(), type = $('bt').value;
  if (!busNo) return alert('Enter a bus name or number');
  const ref = editBusId ? doc(db, 'buses', editBusId) : doc(collection(db, 'buses'));
  await setDoc(ref, { busNo, regNo, type, photo: photoData, deleted: false, updatedAt: Date.now() }, { merge: true });
  editBusId = null; photoData = '';
  $('bb').value = ''; $('br').value = ''; $('bt').value = 'TNSTC'; $('bp').value = ''; $('bprev').style.display = 'none';
  $('saveB').textContent = 'Add bus';
};

$('bl').onclick = async e => {
  const b = e.target;
  if (b.dataset.e) {
    const x = buses.find(v => v.id === b.dataset.e);
    editBusId = x.id; photoData = x.photo || '';
    $('bb').value = x.busNo; $('br').value = x.regNo; $('bt').value = x.type || 'TNSTC';
    if (x.photo) { $('bprev').src = x.photo; $('bprev').style.display = 'block'; }
    $('saveB').textContent = 'Update bus';
    window.scrollTo(0, 0);
  }
  if (b.dataset.d && confirm('Delete this bus?')) {
    await setDoc(doc(db, 'buses', b.dataset.d), { deleted: true, updatedAt: Date.now() }, { merge: true });
  }
};

function tripName(t) {
  const s = t.stops || [];
  if (s.length < 2) return t.time;
  return `${t.time} ${s[0].n} → ${t.arr} ${s[s.length - 1].n}`;
}

function drawTimes() {
  const rid = $('tr').value;
  const mine = timings.filter(t => t.routeId === rid)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  $('tl').innerHTML = mine.map(t => {
    const st = (t.stops || []).map(s => `${esc(s.t || '–')} ${esc(s.n)}`).join(' · ');
    return `<div class="row"><span><b>${esc(tripName(t))}</b> (${esc(t.days)})<br><small>${st}</small></span><button class="mini" data-d="${t.id}">Del</button></div>`;
  }).join('') || 'No trips yet';
  const curG = $('gs').value;
  $('gs').innerHTML = mine.filter(t => t.stops && t.stops.length > 1)
    .map(t => `<option value="${t.id}">${esc(tripName(t))} (${esc(t.days)})</option>`).join('');
  if (curG) $('gs').value = curG;
}

$('tr').onchange = () => { drawDirs(); drawStopInputs(); drawTimes(); };
$('dr').onchange = () => drawStopInputs();

$('addT').onclick = async () => {
  const r = curRoute();
  if (!r) return alert('Choose a route');
  const names = dirNames();
  const inputs = [...$('ts').querySelectorAll('input')];
  const stops = names.map((n, i) => ({ n, t: inputs[i] ? inputs[i].value : '' }));
  const dep = stops[0].t, arr = stops[stops.length - 1].t;
  if (!dep || !arr) return alert('Enter the start time (first stop) and the arrival time (last stop)');
  await setDoc(doc(collection(db, 'timings')), { routeId: r.id, time: dep, arr, days: $('td').value, stops, deleted: false, updatedAt: Date.now() });
  stopKey = '';
  drawStopInputs();
};

$('tl').onclick = async e => {
  const id = e.target.dataset.d;
  if (id && confirm('Delete this trip?')) await setDoc(doc(db, 'timings', id), { deleted: true, updatedAt: Date.now() }, { merge: true });
};

$('gen').onclick = async () => {
  const src = timings.find(t => t.id === $('gs').value);
  if (!src || !src.stops || src.stops.length < 2) return alert('Choose a trip that has stop times');
  const n = parseInt($('gn').value, 10), rest = parseInt($('gr').value, 10);
  if (!(n > 0) || !(rest >= 0)) return alert('Enter valid numbers');
  const st = src.stops;
  const dep = toMin(st[0].t), arr = toMin(st[st.length - 1].t);
  const dur = arr - dep;
  if (!(dur > 0)) return alert('Arrival must be after the start time');
  const offs = st.map(s => s.t ? toMin(s.t) - dep : null);
  let start = arr + rest, made = 0;
  const base = Date.now();
  for (let k = 1; k <= n; k++) {
    if (start + dur >= 1440) break;
    const flip = k % 2 === 1;
    const seq = st.map((s, i) => ({ n: s.n, o: offs[i] }));
    const ordered = flip
      ? seq.slice().reverse().map(x => ({ n: x.n, o: x.o === null ? null : dur - x.o }))
      : seq;
    const out = ordered.map(x => ({ n: x.n, t: x.o === null ? '' : toStr(start + x.o) }));
    await setDoc(doc(collection(db, 'timings')), {
      routeId: src.routeId, time: out[0].t, arr: out[out.length - 1].t,
      days: src.days, stops: out, deleted: false, updatedAt: base + k
    });
    made++;
    start += dur + rest;
  }
  alert(made + ' trips created');
};

$('delAll').onclick = async () => {
  const rid = $('tr').value;
  const list = timings.filter(t => t.routeId === rid);
  if (!list.length) return alert('No trips on this route');
  if (!confirm('Delete all ' + list.length + ' trips of this route?')) return;
  const base = Date.now();
  await Promise.all(list.map((t, i) =>
    setDoc(doc(db, 'timings', t.id), { deleted: true, updatedAt: base + i }, { merge: true })
  ));
};

drawViList();
</script>
</body>
</html>
