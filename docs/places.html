<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Places - Bus Dashboard</title>
<style>
  body{font-family:sans-serif;margin:0;padding:16px;background:#f4f4f4}
  h2,h3{margin:8px 0}
  input,select,button{font-size:16px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
  button{background:#1a73e8;color:#fff;border:0;border-radius:6px;width:auto;padding:8px 14px}
  .card{background:#fff;border-radius:8px;padding:12px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
  .grid2{display:flex;gap:8px}
  .grid2>*{flex:1}
  .mini{background:#c62828;padding:4px 10px;font-size:13px}
  small{color:#555}
  a.back{display:inline-block;margin-bottom:12px;color:#1a73e8;text-decoration:none;font-weight:bold}
  .linkgrid{display:flex;flex-wrap:wrap;gap:8px}
  .linkgrid a{flex:1;min-width:130px;text-align:center;background:#eef2fb;color:#1a73e8;text-decoration:none;padding:10px;border-radius:6px;font-weight:bold}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>Bus Dashboard Login</h2>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password">
  <button id="go">Login</button>
</div>

<div id="app" hidden>
  <a class="back" href="index.html">← Back to Dashboard</a>

  <div class="card">
    <h3>Manage lists</h3>
    <div class="linkgrid">
      <a href="states.html">States</a>
      <a href="districts.html">Districts</a>
      <a href="taluks.html">Taluks</a>
      <a href="pincodes.html">Pincodes</a>
    </div>
  </div>

  <div class="card">
    <h3>Add / Edit place</h3>
    <input id="pn" placeholder="Place name">
    <div class="grid2">
      <input id="pTaluk" list="tkDL" placeholder="Taluk">
      <input id="pDistrict" list="dtDL" placeholder="District">
    </div>
    <div class="grid2">
      <input id="pState" list="stDL" placeholder="State">
      <input id="pPincode" list="pcDL" placeholder="Pincode" inputmode="numeric" maxlength="6">
    </div>
    <datalist id="tkDL"></datalist>
    <datalist id="dtDL"></datalist>
    <datalist id="stDL"></datalist>
    <datalist id="pcDL"></datalist>
    <button id="saveP">Add place</button>
  </div>

  <div class="card">
    <h3>View places</h3>
    <select id="vMode">
      <option value="all">View all</option>
      <option value="taluk">View by Taluk</option>
      <option value="district">View by District</option>
      <option value="state">View by State</option>
      <option value="pincode">View by Pincode</option>
    </select>
    <input id="vValue" list="vValueDL" placeholder="Type or pick a value" hidden>
    <datalist id="vValueDL"></datalist>
    <div id="cnt"></div>
    <input id="q" placeholder="🔎 Search places by name">
    <div id="pl"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrwRy4WCPb8GKFVjZHn36P1uZpcPj4Se0",
  authDomain: "bus-tracker-7c4d8.firebaseapp.com",
  projectId: "bus-tracker-7c4d8",
  storageBucket: "bus-tracker-7c4d8.firebasestorage.app",
  messagingSenderId: "245492004212",
  appId: "1:245492004212:web:7ea379f915eac8f8372821"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.addEventListener('unhandledrejection', e => alert(e.reason && e.reason.message ? e.reason.message : e.reason));

let places = [], editId = null, started = false;

onAuthStateChanged(auth, u => {
  $('login').hidden = !!u;
  $('app').hidden = !u;
  if (u) start();
});
$('go').onclick = () => signInWithEmailAndPassword(auth, $('em').value, $('pw').value).catch(e => alert(e.message));

function start() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, 'places'), s => {
    places = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.deleted);
    drawPlaces();
  });
  fillDL('states', 'stDL');
  fillDL('districts', 'dtDL');
  fillDL('taluks', 'tkDL');
  fillDL('pincodes', 'pcDL');
}

function fillDL(coll, dlId) {
  onSnapshot(collection(db, coll), s => {
    const items = s.docs.map(d => d.data()).filter(x => !x.deleted).map(x => x.name).sort();
    $(dlId).innerHTML = items.map(n => `<option value="${esc(n)}">`).join('');
  });
}

$('saveP').onclick = async () => {
  const name = $('pn').value.trim();
  const taluk = $('pTaluk').value.trim();
  const district = $('pDistrict').value.trim();
  const state = $('pState').value.trim();
  const pincode = $('pPincode').value.trim();
  if (!name) return alert('Enter a place name');
  if (!editId && places.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    return alert('That place already exists');
  }
  const ref = editId ? doc(db, 'places', editId) : doc(collection(db, 'places'));
  await setDoc(ref, { name, taluk, district, state, pincode, deleted: false, updatedAt: Date.now() }, { merge: true });
  editId = null;
  $('pn').value = ''; $('pTaluk').value = ''; $('pDistrict').value = ''; $('pState').value = ''; $('pPincode').value = '';
  $('saveP').textContent = 'Add place';
};

function fieldFor(mode) { return mode === 'all' ? null : mode; }

function drawFilterValueOptions() {
  const mode = $('vMode').value;
  const field = fieldFor(mode);
  if (!field) { $('vValue').hidden = true; $('vValue').value = ''; drawPlaces(); return; }
  const set = new Set(places.map(p => p[field]).filter(Boolean));
  $('vValueDL').innerHTML = [...set].sort().map(v => `<option value="${esc(v)}">`).join('');
  $('vValue').hidden = false;
  drawPlaces();
}
$('vMode').onchange = drawFilterValueOptions;
$('vValue').oninput = drawPlaces;
$('q').oninput = drawPlaces;

function drawPlaces() {
  let list = places.slice().sort((a, b) => a.name.localeCompare(b.name));
  const mode = $('vMode').value;
  const field = fieldFor(mode);
  if (field) {
    const val = $('vValue').value.trim();
    list = val ? list.filter(p => (p[field] || '').toLowerCase() === val.toLowerCase()) : [];
  }
  const q = $('q').value.trim().toLowerCase();
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
  $('cnt').innerHTML = `<small>${list.length} shown</small>`;
  $('pl').innerHTML = list.map(p => {
    const bits = [p.taluk, p.district, p.state, p.pincode].filter(Boolean).join(' · ');
    return `<div class="row"><span><b>${esc(p.name)}</b>${bits ? `<br><small>${esc(bits)}</small>` : ''}</span>
     <span><button data-e="${p.id}">Edit</button> <button class="mini" data-d="${p.id}">Del</button></span></div>`;
  }).join('') || (field && !$('vValue').value.trim() ? 'Type or pick a value above' : 'No matches');
}

$('pl').addEventListener('click', async e => {
  const b = e.target;
  if (b.dataset.e) {
    const p = places.find(x => x.id === b.dataset.e);
    editId = p.id;
    $('pn').value = p.name;
    $('pTaluk').value = p.taluk || ''; $('pDistrict').value = p.district || '';
    $('pState').value = p.state || ''; $('pPincode').value = p.pincode || '';
    $('saveP').textContent = 'Update place';
    window.scrollTo(0, 0);
  }
  if (b.dataset.d && confirm('Delete this place?')) {
    await setDoc(doc(db, 'places', b.dataset.d), { deleted: true, updatedAt: Date.now() }, { merge: true });
  }
});
</script>
</body>
</html>
