<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>States - Bus Dashboard</title>
<style>
  body{font-family:sans-serif;margin:0;padding:16px;background:#f4f4f4}
  h2,h3{margin:8px 0}
  input,button{font-size:16px;padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
  button{background:#1a73e8;color:#fff;border:0;border-radius:6px;width:auto;padding:8px 14px}
  .card{background:#fff;border-radius:8px;padding:12px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px 0;gap:8px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .addrow button{width:auto;white-space:nowrap;flex:0 0 auto}
  .mini{background:#c62828;padding:4px 10px;font-size:13px}
  small{color:#555}
  a.back{display:inline-block;margin-bottom:12px;color:#1a73e8;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div id="login" class="card">
  <h2>Bus Dashboard Login</h2>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password">
  <button id="go">Login</button>
</div>

<div id="app" hidden>
  <a class="back" href="places.html">← Back to Places</a>
  <div class="card">
    <h3>States</h3>
    <div class="addrow">
      <input id="nIn" placeholder="Add a new state">
      <button id="nSave">Add</button>
    </div>
    <input id="q" placeholder="🔎 Search states">
    <div id="cnt"></div>
    <div id="list"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrwRy4WCPb8GKFVjZHn36P1uZpcPj4Se0",
  authDomain: "bus-tracker-7c4d8.firebaseapp.com",
  projectId: "bus-tracker-7c4d8",
  storageBucket: "bus-tracker-7c4d8.firebasestorage.app",
  messagingSenderId: "245492004212",
  appId: "1:245492004212:web:7ea379f915eac8f8372821"
};
const COLL = 'states';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.addEventListener('unhandledrejection', e => alert(e.reason && e.reason.message ? e.reason.message : e.reason));

let items = [], editId = null, started = false;

onAuthStateChanged(auth, u => {
  $('login').hidden = !!u;
  $('app').hidden = !u;
  if (u) start();
});
$('go').onclick = () => signInWithEmailAndPassword(auth, $('em').value, $('pw').value).catch(e => alert(e.message));

function start() {
  if (started) return;
  started = true;
  onSnapshot(collection(db, COLL), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.deleted);
    draw();
  });
}

function draw() {
  items.sort((a, b) => a.name.localeCompare(b.name));
  const q = $('q').value.trim().toLowerCase();
  const shown = q ? items.filter(x => x.name.toLowerCase().includes(q)) : items;
  $('cnt').innerHTML = `<small>${items.length} total${q ? `, ${shown.length} shown` : ''}</small>`;
  $('list').innerHTML = shown.map(x =>
    `<div class="row"><span>${esc(x.name)}</span>
     <span><button data-e="${x.id}">Edit</button> <button class="mini" data-d="${x.id}">Del</button></span></div>`
  ).join('') || 'No matches';
}
$('q').oninput = draw;

$('nSave').onclick = async () => {
  const name = $('nIn').value.trim();
  if (!name) return alert('Enter a value');
  if (!editId && items.some(x => x.name.toLowerCase() === name.toLowerCase())) {
    $('nIn').value = '';
    return alert('That value already exists');
  }
  const ref = editId ? doc(db, COLL, editId) : doc(collection(db, COLL));
  await setDoc(ref, { name, deleted: false, updatedAt: Date.now() }, { merge: true });
  editId = null;
  $('nIn').value = '';
  $('nSave').textContent = 'Add';
};

$('list').onclick = async e => {
  const b = e.target;
  if (b.dataset.e) {
    const x = items.find(v => v.id === b.dataset.e);
    editId = x.id;
    $('nIn').value = x.name;
    $('nSave').textContent = 'Update';
    window.scrollTo(0, 0);
  }
  if (b.dataset.d && confirm('Delete this value?')) {
    await setDoc(doc(db, COLL, b.dataset.d), { deleted: true, updatedAt: Date.now() }, { merge: true });
  }
};
</script>
</body>
</html>
